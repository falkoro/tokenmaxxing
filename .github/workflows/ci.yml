name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type-check, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Type-check and build
        run: bun run build

      - name: Run tests
        run: bun run test

  # Cross-platform Rust compile signal for the Windows/Linux port.
  # windows/linux must pass (they are this fork's release targets).
  # macOS is informational: src/panel/macos.rs predates the tauri-nspanel v2.1
  # API rework and has never compiled in this fork — see issue #17.
  rust-build:
    name: Tauri build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            allow-failure: true
          - platform: windows-latest
            allow-failure: false
          - platform: ubuntu-latest
            allow-failure: false
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Bundle plugins
        run: bun run bundle:plugins

      - name: Build frontend
        run: bun run build

      - name: Cargo build (src-tauri)
        working-directory: ./src-tauri
        run: cargo build --release
